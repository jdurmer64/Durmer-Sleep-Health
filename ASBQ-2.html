<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete Sleep Behavior Questionnaire (ASBQ-2)</title>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --ink: #1c2541;
    --muted: #5b6577;
    --line: #d5dbe4;
    --accent: #2f6f8f;
    --good: #2e7d5b;
    --mid: #b7791f;
    --poor: #b83b34;
    --chip: #f4f6f9;
    --chip-on: #1c2541;
    --chip-on-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1522;
      --surface: #182032;
      --ink: #e6ebf3;
      --muted: #9aa5b8;
      --line: #2c3750;
      --accent: #6fb3d2;
      --good: #5cc497;
      --mid: #e5b04f;
      --poor: #ec7a72;
      --chip: #1f2940;
      --chip-on: #e6ebf3;
      --chip-on-ink: #0f1522;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 140px; }
  header h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    line-height: 1.15;
    margin: 0 0 6px;
  }
  header p { color: var(--muted); margin: 0 0 4px; max-width: 68ch; }
  .meta {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin: 24px 0 8px;
  }
  .meta label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: 4px; }
  .meta input {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  .instructions {
    margin: 24px 0 12px; font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 1.15rem;
  }
  ol.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  ol.items li { padding: 16px 18px; border-top: 1px solid var(--line); }
  ol.items li:first-child { border-top: 0; }
  ol.items li.unanswered-flag { box-shadow: inset 4px 0 0 var(--poor); }
  .q { display: flex; gap: 12px; margin-bottom: 10px; }
  .q .n { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 1.6em; font-weight: 600; }
  fieldset { border: 0; margin: 0; padding: 0 0 0 calc(1.6em + 12px); }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .scale input { position: absolute; opacity: 0; pointer-events: none; }
  .scale label {
    display: block; text-align: center; padding: 8px 4px; font-size: .88rem;
    background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer; user-select: none; transition: background .12s, color .12s;
  }
  .scale label small { display: block; font-size: .72rem; color: var(--muted); }
  .scale input:checked + label { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .scale input:checked + label small { color: inherit; opacity: .75; }
  .scale input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
  .flag { display: none; font-size: .8rem; color: var(--mid); margin: 8px 0 0 calc(1.6em + 12px); }
  li.flagged .flag { display: block; }

  /* Sticky score bar */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 20px;
  }
  .bar-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .total { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .total span { font-size: 1rem; color: var(--muted); font-weight: 400; }
  .gauge { flex: 1; min-width: 220px; }
  .track { position: relative; height: 10px; border-radius: 5px; overflow: hidden; display: flex; }
  .track i { display: block; height: 100%; }
  .marker {
    position: absolute; top: -5px; width: 4px; height: 20px; background: var(--ink);
    border-radius: 2px; transform: translateX(-50%); transition: left .25s;
  }
  .gauge-wrap { position: relative; }
  .ticks { position: relative; height: 16px; font-size: .72rem; color: var(--muted); margin-top: 4px; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .status { font-size: .9rem; color: var(--muted); }

  .actions { display: flex; gap: 10px; margin: 24px 0; flex-wrap: wrap; }
  button {
    font: inherit; padding: 10px 18px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--ink); background: var(--ink); color: var(--surface);
  }
  button.secondary { background: transparent; color: var(--ink); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #results { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  #results.show { display: block; }
  #results h2 { font-family: "Iowan Old Style", Palatino, Georgia, serif; margin: 0 0 4px; font-size: 1.6rem; }
  .verdict { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; }
  .verdict.good { color: var(--good); } .verdict.mid { color: var(--mid); } .verdict.poor { color: var(--poor); }
  #results h3 { font-size: 1rem; margin: 24px 0 8px; }
  #results p, #results li { max-width: 72ch; }
  .focus-list { padding-left: 1.2em; }
  .focus-list li { margin-bottom: 10px; }
  .focus-list .tip { display: block; color: var(--muted); font-size: .92rem; }
  .note { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 20px; }

  @media (max-width: 560px) {
    fieldset, .flag { padding-left: 0; margin-left: 0; }
    .scale label { font-size: .78rem; padding: 8px 2px; }
    .total { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    .bar, .actions { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { padding-bottom: 20px; }
    ol.items li { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Athlete Sleep Behavior Questionnaire (ASBQ-2)</h1>
    <p>Driller, Mah &amp; Halson (2025), International Journal of Sports Science &amp; Coaching, 20(6), 2681–2686.</p>
  </header>

  <div class="meta">
    <label>Athlete name<input id="name" type="text" autocomplete="off"></label>
    <label>Sport / team<input id="sport" type="text" autocomplete="off"></label>
    <label>Date<input id="date" type="date"></label>
  </div>

  <p class="instructions">Please answer the following questions as they relate to the last month.</p>

  <ol class="items" id="items"></ol>

  <div class="actions">
    <button id="scoreBtn" type="button">Show results</button>
    <button id="printBtn" type="button" class="secondary">Print or save as PDF</button>
    <button id="resetBtn" type="button" class="secondary">Clear all answers</button>
  </div>

  <section id="results" aria-live="polite"></section>
</div>

<div class="bar" role="status">
  <div class="bar-inner">
    <div class="total" id="total">0<span> / 90</span></div>
    <div class="gauge">
      <div class="gauge-wrap">
        <div class="track" aria-hidden="true">
          <i style="width:25%;background:var(--good)"></i>
          <i style="width:6.944%;background:var(--mid)"></i>
          <i style="width:68.056%;background:var(--poor)"></i>
        </div>
        <div class="marker" id="marker" style="left:0%"></div>
      </div>
      <div class="ticks" aria-hidden="true">
        <span style="left:0%">18</span>
        <span style="left:25%">36</span>
        <span style="left:33.33%">42</span>
        <span style="left:100%">90</span>
      </div>
    </div>
    <div class="status" id="status">0 of 18 answered</div>
  </div>
</div>

<script>
const ITEMS = [
  "I take late afternoon naps lasting longer than 30 min (e.g., later than 4pm)",
  "I consume caffeine after 1pm (e.g., coffee, tea, caffeine pills/supplements)",
  "I compete or train at high intensity late at night (after 7pm)",
  "I consume alcohol within 4 h of going to bed",
  "I go to bed at different times each night (more than ± 1 h variation)",
  "I go to bed with sore muscles",
  "Using electronic devices/technology (e.g., laptop, phone, television, video games, social media) shortens my sleep, or leads to difficulty with falling asleep",
  "I stay awake thinking, planning, and/or worrying when I am in bed",
  "I need prescription sleeping medications/pills or over-the-counter sleep aids (e.g., melatonin) to help me sleep",
  "I wake to go to the bathroom more than once per night",
  "I wake myself and/or my bed partner with my snoring",
  "I wake myself and/or my bed partner with my muscle twitching",
  "I get up at different times each morning (more than ± 1 h variation)",
  "At home, I sleep in a less than ideal environment (e.g., too light, too noisy, uncomfortable bed/pillow, too hot/cold)",
  "I sleep in foreign environments (e.g., hotel rooms)",
  "Travel (either daily/routine or crossing time zones) impacts my sleep",
  "My sleep is interrupted by others in my household (e.g., children, partners, housemates, pets)",
  "I eat a large meal in the hour leading up to bedtime"
];
const SCALE = ["Never", "Rarely", "Sometimes", "Frequently", "Always"];

// Short practitioner prompts for flagged items. Items 2, 5/13, 6 and 14 follow the
// examples given in the publication; the rest are drawn from the paper's rationale for each item.
const TIPS = {
  1: "Keep naps to roughly 20–90 min and finish them earlier in the afternoon (ideally before 3–4pm).",
  2: "Shift caffeine to the morning or early afternoon, swap to decaf, or taper intake gradually.",
  3: "Where possible, review scheduling of high-intensity sessions late in the evening and plan a longer wind-down after night competition.",
  4: "Discuss alcohol intake and timing relative to bedtime.",
  5: "Set consistent lights-out and rise times (including weekends), use morning bright light, and add a pre-bed wind-down routine.",
  6: "Consider recovery strategies such as cold/contrast water immersion or compression garments before bed.",
  7: "Review device and social media use in bed and the time it takes away from the sleep window.",
  8: "Explore strategies to reduce pre-sleep cognitive arousal (e.g., wind-down routine, writing down worries or plans earlier in the evening).",
  9: "Review sleep aid use with a medical practitioner; regular use may lead to dependence or next-day drowsiness.",
  10: "Discuss evening fluid timing and, if persistent, consider medical review.",
  11: "Frequent snoring that disrupts sleep may warrant medical screening.",
  12: "Frequent night-time muscle twitching that disrupts sleep may warrant medical review.",
  13: "Set consistent lights-out and rise times (including weekends), use morning bright light, and add a pre-bed wind-down routine.",
  14: "Aim for a cool (~18 °C), dark, quiet room: blackout curtains, eye mask, ear plugs, and comfortable bedding.",
  15: "Plan for sleep away from home (eye mask, ear plugs, familiar pillow, room set-up on arrival).",
  16: "Plan travel to protect sleep, including strategies for routine commutes and time-zone changes.",
  17: "Identify the main household disruption and agree on practical changes (e.g., sleep arrangements, pets out of the bedroom).",
  18: "Move the main evening meal earlier, leaving more than an hour before bed."
};

const list = document.getElementById("items");
ITEMS.forEach((text, i) => {
  const n = i + 1;
  const li = document.createElement("li");
  li.id = "item" + n;
  li.innerHTML = `
    <div class="q"><span class="n">${n}</span><span id="qt${n}">${text}</span></div>
    <fieldset aria-labelledby="qt${n}">
      <legend>Item ${n}</legend>
      <div class="scale">
        ${SCALE.map((s, k) => `
          <input type="radio" name="q${n}" id="q${n}_${k+1}" value="${k+1}">
          <label for="q${n}_${k+1}">${s}<small>${k+1}</small></label>`).join("")}
      </div>
    </fieldset>
    <div class="flag">Possible focus area (scored 3 or higher)</div>`;
  list.appendChild(li);
});

document.getElementById("date").valueAsDate = new Date();

function getAnswers() {
  return ITEMS.map((_, i) => {
    const c = document.querySelector(`input[name="q${i+1}"]:checked`);
    return c ? Number(c.value) : null;
  });
}

function band(total) {
  // Thresholds from Driller et al. (2025): ≤36 good, ≥42 poor; 37–41 falls between.
  if (total <= 36) return { key: "good", label: "Good sleep behavior" };
  if (total >= 42) return { key: "poor", label: "Poor sleep behavior" };
  return { key: "mid", label: "Moderate sleep behavior (between thresholds)" };
}

function update() {
  const a = getAnswers();
  const answered = a.filter(v => v !== null).length;
  const total = a.reduce((s, v) => s + (v || 0), 0);
  document.getElementById("total").innerHTML = `${total}<span> / 90</span>`;
  const pct = answered ? Math.max(0, Math.min(100, (total - 18) / 72 * 100)) : 0;
  document.getElementById("marker").style.left = pct + "%";
  document.getElementById("status").textContent =
    answered === 18 ? band(total).label : `${answered} of 18 answered`;
  a.forEach((v, i) => {
    const li = document.getElementById("item" + (i+1));
    li.classList.toggle("flagged", v !== null && v >= 3);
    if (v !== null) li.classList.remove("unanswered-flag");
  });
}

list.addEventListener("change", update);

document.getElementById("scoreBtn").addEventListener("click", () => {
  const a = getAnswers();
  const missing = a.map((v, i) => v === null ? i + 1 : null).filter(Boolean);
  const res = document.getElementById("results");
  if (missing.length) {
    missing.forEach(n => document.getElementById("item" + n).classList.add("unanswered-flag"));
    res.className = "show";
    res.innerHTML = `<h2>Answer every item to get a score</h2>
      <p>Still unanswered: item${missing.length > 1 ? "s" : ""} ${missing.join(", ")}. They're marked with a red edge above.</p>`;
    document.getElementById("item" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const total = a.reduce((s, v) => s + v, 0);
  const b = band(total);
  const flagged = a.map((v, i) => ({ n: i + 1, v })).filter(x => x.v >= 3)
                   .sort((x, y) => y.v - x.v || x.n - y.n);
  const name = document.getElementById("name").value.trim();
  const sport = document.getElementById("sport").value.trim();
  const date = document.getElementById("date").value;

  res.className = "show";
  res.innerHTML = `
    <h2>Global score: ${total} / 90</h2>
    <p class="verdict ${b.key}">${b.label}</p>
    ${(name || sport || date) ? `<p>${[name, sport, date].filter(Boolean).join(", ")}</p>` : ""}
    <p>Score bands: 36 or below is good sleep behavior; 42 or above is poor sleep behavior. Scores of 37–41 fall between the two published thresholds.</p>
    <h3>${flagged.length ? `Focus areas (${flagged.length} item${flagged.length > 1 ? "s" : ""} answered Sometimes, Frequently or Always)` : "No focus areas"}</h3>
    ${flagged.length
      ? `<ol class="focus-list">${flagged.map(f => `
          <li><strong>Item ${f.n} (${SCALE[f.v-1]}, ${f.v}):</strong> ${ITEMS[f.n-1]}
          <span class="tip">${TIPS[f.n]}</span></li>`).join("")}</ol>`
      : `<p>No item was answered Sometimes or more often.</p>`}
    <p class="note">Each item is scored 1 (Never) to 5 (Always) and summed for a global score of 18–90. The authors describe the ASBQ-2 as a practical assessment tool, not a clinical screening instrument, and present the thresholds as a guide only. Any item scored 3 or higher is suggested as a target for discussion and action planning.</p>`;
  res.scrollIntoView({ behavior: "smooth", block: "start" });
});

document.getElementById("printBtn").addEventListener("click", () => {
  document.getElementById("scoreBtn").click();
  setTimeout(() => window.print(), 300);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll('.scale input').forEach(r => r.checked = false);
  document.querySelectorAll('ol.items li').forEach(li => li.classList.remove("flagged", "unanswered-flag"));
  const res = document.getElementById("results");
  res.className = ""; res.innerHTML = "";
  update();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

update();
</script>
</body>
</html>
